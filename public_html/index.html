<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lawntamers</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --green: #22c55e;
        --green-soft: #14532d;
        --text: #f8fafc;
        --muted: #cbd5e1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0b1220, #111827 45%, #0b1f18);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .wrap {
        width: min(900px, 90vw);
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 22px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        text-align: center;
      }
      .logo {
        display: inline-block;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 4vw, 4rem);
      }
      p {
        margin: 0 auto 28px;
        max-width: 640px;
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, var(--green), #16a34a);
        color: #04130b;
        text-decoration: none;
        padding: 16px 28px;
        border-radius: 12px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">Lawntamers</div>
      <h1>Admin Dashboard</h1>
      <p>
        Welcome to the Lawntamers management portal. Use the admin login below to access the dashboard,
        jobs, payments, and service tracking tools.
      </p>
      <a class="btn" href="/login/">Open Login</a>
    </div>
  </body>
</html>
